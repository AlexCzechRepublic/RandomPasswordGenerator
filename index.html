<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>🔒 Password Generator</h2>
        
        <div class="result-container">
            <input type="text" id="passwordResult" readonly placeholder="Your secure password">
        </div>

        <div class="settings">
            <div class="setting-item">
                <label for="length">Length: <span id="lengthValue">12</span></label>
                <input type="range" id="length" min="6" max="32" value="12">
            </div>
            
            <div class="setting-item">
                <label>
                    <input type="checkbox" id="uppercase" checked> Include Uppercase (A-Z)
                </label>
            </div>

            <div class="setting-item">
                <label>
                    <input type="checkbox" id="numbers" checked> Include Numbers (0-9)
                </label>
            </div>

            <div class="setting-item">
                <label>
                    <input type="checkbox" id="symbols" checked> Include Symbols (!@#$...)
                </label>
            </div>
        </div>

        <button id="generateBtn">Generate Password</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
